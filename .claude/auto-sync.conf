# GitHub 자동 동기화 설정
# .claude/auto-sync.conf

# ===========================================
# 기본 설정
# ===========================================

# 자동 동기화 활성화 (true/false)
AUTO_SYNC_ENABLED=true

# 자동 푸시 활성화 (true/false)
AUTO_PUSH=true

# 확인 메시지 표시 (true/false)
# true: 동기화 전 확인 요청
# false: 자동으로 동기화
REQUIRE_CONFIRMATION=false

# ===========================================
# 타이밍 설정
# ===========================================

# 체크 간격 (초)
# 파일 변경 후 이 시간이 지나면 동기화
AUTO_SYNC_INTERVAL=30

# 최소 변경사항 수
# 이 개수 이상의 파일이 변경되어야 동기화
MIN_CHANGES=1

# ===========================================
# 파일 필터링
# ===========================================

# 제외할 파일 패턴 (쉼표로 구분)
EXCLUDE_PATTERNS="node_modules,.env,*.log,.DS_Store,*.tmp,dist,build,.next,.cache"

# 최대 파일 크기 (MB)
# 이 크기를 초과하는 파일은 경고
MAX_FILE_SIZE=10

# ===========================================
# 커밋 메시지
# ===========================================

# 커밋 메시지 템플릿
# 사용 가능한 변수:
#   {summary} - 자동 생성된 요약
#   {files} - 변경된 파일 수
#   {branch} - 현재 브랜치
COMMIT_MESSAGE_TEMPLATE="auto: {summary}"

# ===========================================
# 보안 설정
# ===========================================

# 민감 정보 체크 활성화 (true/false)
CHECK_SENSITIVE_INFO=true

# 민감 정보 패턴 (정규표현식, 세미콜론으로 구분)
SENSITIVE_PATTERNS="api.?key.*=;password.*=;secret.*=;token.*=;private.?key"

# ===========================================
# 브랜치 설정
# ===========================================

# 보호된 브랜치 (직접 푸시 전 경고)
PROTECTED_BRANCHES="main,master,production"

# ===========================================
# 알림 설정
# ===========================================

# 동기화 성공 시 알림 (true/false)
NOTIFY_ON_SUCCESS=true

# 동기화 실패 시 알림 (true/false)
NOTIFY_ON_FAILURE=true

# 민감 정보 발견 시 알림 (true/false)
NOTIFY_ON_SENSITIVE=true

# ===========================================
# 고급 설정
# ===========================================

# Git 작업 타임아웃 (초)
GIT_TIMEOUT=60

# 재시도 횟수 (푸시 실패 시)
RETRY_COUNT=3

# 재시도 간격 (초)
RETRY_INTERVAL=5

# 로그 파일 위치
LOG_FILE=".claude/.sync-history.log"

# 로그 레벨 (DEBUG, INFO, WARN, ERROR)
LOG_LEVEL="INFO"

# ===========================================
# 실험적 기능
# ===========================================

# 자동 풀 리퀘스트 생성 (true/false)
AUTO_CREATE_PR=false

# 자동 머지 (true/false)
AUTO_MERGE=false

# 자동 태그 생성 (true/false)
AUTO_TAG=false
